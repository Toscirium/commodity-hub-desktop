name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Linux (Qt6/CMake)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 + build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            qt6-base-dev qt6-base-dev-tools qt6-webengine-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Smoke test (offscreen)
        run: timeout 10 env QT_QPA_PLATFORM=offscreen ./build/CommodityHubDesktop || test $? -eq 124

      - name: Live API integration test
        # Hits the real production fetch-all-commodities edge function (same
        # one the shipped app calls, unauthenticated) and runs the response
        # through the actual parsing/spread/screener code — see
        # tests/LivePipelineTest.cpp. Catches API schema drift and real-data
        # edge cases a synthetic-fixture test wouldn't.
        run: timeout 45 env QT_QPA_PLATFORM=offscreen ./build/LivePipelineTest
